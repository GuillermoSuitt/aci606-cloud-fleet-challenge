<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACI606 Cloud Fleet Dashboard</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: dark; }
    body { margin: 0; background:#0d1117; color:#e6edf3; }
    header { padding:22px 28px; border-bottom:1px solid #30363d; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:22px; }
    .tag { color:#8b949e; font-size:14px; }
    main { padding:28px; display:flex; flex-direction:column; gap:24px; }
    h2 { margin:0 0 12px; font-size:16px; color:#8b949e; text-transform:uppercase; letter-spacing:1px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .kpi { border:1px solid #30363d; border-radius:12px; padding:14px; background:#161b22; }
    .kpi .v { font-size:24px; font-weight:700; margin-top:4px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .card { border:1px solid #30363d; border-radius:14px; padding:18px; background:#161b22; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .robot { font-size:20px; font-weight:700; }
    .badge { padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .NORMAL { background:#1f6f43; color:#d2f8e2; }
    .WARNING { background:#8a5a00; color:#ffefc7; }
    .CRITICAL { background:#a1262b; color:#ffe0e0; }
    .row { display:flex; justify-content:space-between; padding:5px 0; color:#c9d1d9; }
    .bar { height:8px; background:#30363d; border-radius:99px; overflow:hidden; margin:4px 0 8px; }
    .fill { height:100%; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
    .empty { padding:40px; text-align:center; color:#8b949e; border:1px dashed #30363d; border-radius:14px; }
  </style>
</head>
<body>
<header>
  <div><h1>Cloud Fleet Dashboard</h1><div class="tag">ACI606 · Render + Neon</div></div>
  <div id="status" class="tag"><span class="dot" style="background:#8b949e"></span>conectando…</div>
</header>
<main>
  <section>
    <h2>Estado del servicio</h2>
    <div id="kpis" class="kpis"></div>
  </section>
  <section>
    <h2>Flota</h2>
    <div id="cards" class="cards"></div>
  </section>
</main>
<script>
const cards = document.getElementById('cards');
const kpis = document.getElementById('kpis');
const statusEl = document.getElementById('status');

function kpi(label, value) {
  return `<div class="kpi"><div class="tag">${label}</div><div class="v">${value}</div></div>`;
}

function uptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min ${Math.floor(s % 60)} s`;
}

function card(r) {
  const battery = Math.max(0, Math.min(100, Number(r.battery)));
  const color = battery > 50 ? '#3fb950' : battery > 20 ? '#d29922' : '#f85149';
  const status = r.predicted_status || 'SIN MODELO';
  const conf = r.confidence != null ? ` · ${(r.confidence * 100).toFixed(0)}%` : '';
  return `<div class="card">
    <div class="top">
      <div class="robot">${r.robot_id}</div>
      <span class="badge ${status}">${status}${conf}</span>
    </div>
    <div class="row"><span>Batería</span><span>${battery.toFixed(1)} %</span></div>
    <div class="bar"><div class="fill" style="width:${battery}%;background:${color}"></div></div>
    <div class="row"><span>Velocidad</span><span>${Number(r.speed).toFixed(2)}</span></div>
    <div class="row"><span>Temp. motor</span><span>${Number(r.motor_temp).toFixed(1)} °C</span></div>
    <div class="row"><span>Vibración</span><span>${Number(r.vibration).toFixed(2)}</span></div>
    <div class="row"><span>Obstáculo</span><span>${Number(r.obstacle_distance).toFixed(2)} m</span></div>
    <div class="row"><span>Registros históricos</span><span>${r.samples}</span></div>
  </div>`;
}

async function refresh() {
  try {
    const res = await fetch('/dashboard/data');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const robots = data.robots, s = data.service;

    const conteo = { NORMAL: 0, WARNING: 0, CRITICAL: 0 };
    robots.forEach(r => { if (conteo[r.predicted_status] !== undefined) conteo[r.predicted_status]++; });
    const total = robots.reduce((acc, r) => acc + r.samples, 0);

    statusEl.innerHTML = `<span class="dot" style="background:#3fb950"></span>API en línea · ${robots.length} robot(s)`;
    kpis.innerHTML =
      kpi('Uptime', uptime(s.uptime_seconds)) +
      kpi('Telemetría recibida', s.requests.telemetry) +
      kpi('Predicciones', s.requests.predict) +
      kpi('Errores 4xx / 5xx', `${s.errors.client_4xx} / ${s.errors.server_5xx}`) +
      kpi('Latencia p95', `${s.predict_latency_ms.p95} ms`) +
      kpi('Registros en BD', total) +
      kpi('Normal / Warn / Crit', `${conteo.NORMAL} / ${conteo.WARNING} / ${conteo.CRITICAL}`);

    cards.innerHTML = robots.length
      ? robots.map(card).join('')
      : '<div class="empty">Ejecuta el simulador para comenzar a recibir robots.</div>';
  } catch (err) {
    statusEl.innerHTML = '<span class="dot" style="background:#f85149"></span>API no disponible';
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
